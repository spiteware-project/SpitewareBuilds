name: Release on main

on:
  push:
    branches:
      - main
    # Documentation-only pushes must not publish a release with unchanged
    # binaries. A docs commit on 27.10.2026 created build-81 this way.
    paths-ignore:
      - 'docs/**'
      - 'readme.md'
      - 'README.md'
      - '.github/**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and stage the four root artifacts
        run: python3 artifacts.py stage-release --output-dir dist

      - name: Create GitHub Release with reviewed artifacts and manifest
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          files: |
            dist/SpitewareLoader.exe
            dist/cs2_kernel_pro.exe
            dist/cs2_kernel_esp.exe
            dist/cs2_kernel_obsidian.exe
            dist/manifest.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
